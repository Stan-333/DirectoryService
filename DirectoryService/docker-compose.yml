services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PW}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  directory-service:
    container_name: directory-service
    build:
      # Корень монорепо: образу нужны общие props-файлы и библиотеки Shared.
      context: ..
      dockerfile: DirectoryService/Dockerfile
      # PAT для GitHub Packages (Stan333.SharedKernel), только на время restore; см. secrets ниже.
      secrets:
        - nuget_token
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DirectoryServiceDb=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PW}
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Seq=http://seq:5341
      # Приложение доступно только через nginx (порт не проброшен на хост),
      # поэтому X-Forwarded-For/Proto можно принимать от любого прокси в сети compose.
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    expose:
      - '8080'
    healthcheck:
      # В образах aspnet нет curl и wget, поэтому HTTP-запрос отправляем через /dev/tcp в bash.
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '^HTTP/'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    container_name: directory-service-nginx
    image: nginx:latest
    restart: always
    depends_on:
      directory-service:
        condition: service_healthy
    ports:
      - '5211:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost/ > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_MAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PW}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - '5050:80'

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data

  seq:
    container_name: seq
    image: datalust/seq:latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_PASSWORD=${SEQ_PASSWORD}
    ports:
      - '5341:5341'
      - '8081:80'
    volumes:
      - seq-data:/data

secrets:
  # Значение берётся из переменной окружения NUGET_AUTH_TOKEN или из .env рядом с этим файлом
  # (PAT classic с правом read:packages). В репозиторий токен не попадает: .env в .gitignore.
  nuget_token:
    environment: NUGET_AUTH_TOKEN

volumes:
  postgresql_data:
  pgadmin-data:
  redis-data:
  redisinsight-data:
  seq-data: